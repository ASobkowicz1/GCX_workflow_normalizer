        \        coordinateSystem: 'cartesian2d',\n        data: rows.map((row, index)\
        \ => ({ ...row, value: [primaryValue(row), index] })),\n        renderItem:\
        \ (params) => {\n            const row = rows[params.dataIndex];\n       \
        \     const coord = params.coordSys;\n            const rowStep = coord.height\
        \ / Math.max(rows.length, 1);\n            const cardHeight = Math.max(42,\
        \ Math.min(58, rowStep - 8));\n            const x = coord.x;\n          \
        \  const y = coord.y + params.dataIndex * rowStep + (rowStep - cardHeight)\
        \ / 2;\n            const width = coord.width;\n            const barX = x\
        \ + Math.min(430, width * 0.48);\n            const metricX = Math.max(barX\
        \ + 124, x + width - 228);\n            const barWidth = Math.max(6, Math.min(width\
        \ - (barX - x) - 250, 220) * (primaryValue(row) / maxPrimary));\n        \
        \    const typeText = row.type.replace(/_/g, ' ');\n            const targetText\
        \ = `${row.namespace} / ${row.resource}`;\n\n            return {\n      \
        \          type: 'group',\n                children: [\n                 \
        \   {\n                        type: 'rect',\n                        shape:\
        \ { x, y, width, height: cardHeight, r: 8 },\n                        style:\
        \ {\n                            fill: params.dataIndex % 2 === 0 ? palette.panel\
        \ : palette.panelSoft,\n                            stroke: 'rgba(148, 163,\
        \ 184, 0.18)',\n                            lineWidth: 1,\n              \
        \          },\n                    },\n                    {\n           \
        \             type: 'rect',\n                        shape: { x: x + 12, y:\
        \ y + 13, width: 34, height: 22, r: 11 },\n                        style:\
        \ { fill: 'rgba(0, 255, 212, 0.14)', stroke: palette.cyan, lineWidth: 1 },\n\
        \                    },\n                    {\n                        type:\
        \ 'text',\n                        style: {\n                            x:\
        \ x + 29,\n                            y: y + 24,\n                      \
        \      text: `#${row.rank}`,\n                            fill: palette.cyan,\n\
        \                            fontSize: 12,\n                            fontWeight:\
        \ 800,\n                            textAlign: 'center',\n               \
        \             textVerticalAlign: 'middle',\n                        },\n \
        \                   },\n                    {\n                        type:\
        \ 'text',\n                        style: {\n                            x:\
        \ x + 58,\n                            y: y + 17,\n                      \
        \      text: typeText,\n                            fill: palette.text,\n\
        \                            fontSize: 12,\n                            fontWeight:\
        \ 800,\n                            width: Math.max(160, barX - x - 82),\n\
        \                            overflow: 'truncate',\n                     \
        \   },\n                    },\n                    {\n                  \
        \      type: 'text',\n                        style: {\n                 \
        \           x: x + 58,\n                            y: y + 36,\n         \
        \                   text: targetText,\n                            fill: palette.muted,\n\
        \                            fontSize: 11,\n                            fontWeight:\
        \ 600,\n                            width: Math.max(160, barX - x - 82),\n\
        \                            overflow: 'truncate',\n                     \
        \   },\n                    },\n                    {\n                  \
        \      type: 'rect',\n                        shape: { x: barX, y: y + 22,\
        \ width: Math.min(220, width - (barX - x) - 250), height: 8, r: 4 },\n   \
        \                     style: { fill: 'rgba(148, 163, 184, 0.16)' },\n    \
        \                },\n                    {\n                        type:\
        \ 'rect',\n                        shape: { x: barX, y: y + 22, width: barWidth,\
        \ height: 8, r: 4 },\n                        style: {\n                 \
        \           fill: recommendationMetric === 'cost' ? palette.green : palette.cyan,\n\
        \                            shadowBlur: 12,\n                           \
        \ shadowColor: recommendationMetric === 'cost'\n                         \
        \       ? 'rgba(52, 211, 153, 0.35)'\n                                : 'rgba(0,\
        \ 255, 212, 0.35)',\n                        },\n                    },\n\
        \                    {\n                        type: 'text',\n          \
        \              style: {\n                            x: metricX,\n       \
        \                     y: y + 18,\n                            text: formatValue(row.co2,\
        \ 'g CO₂e'),\n                            fill: palette.cyan,\n          \
        \                  fontSize: 12,\n                            fontWeight:\
        \ 800,\n                            width: 106,\n                        \
        \    overflow: 'truncate',\n                        },\n                 \
        \   },\n                    {\n                        type: 'text',\n   \
        \                     style: {\n                            x: metricX + 116,\n\
        \                            y: y + 18,\n                            text:\
