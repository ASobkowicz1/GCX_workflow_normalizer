apiVersion: dashboard.grafana.app/v1
kind: Dashboard
metadata:
  name: d-74f0077a206555d2f470
  annotations:
    grafana.app/folder: f-1ff279e695021b43214b
spec:
  annotations:
    list:
    - builtIn: 1
      datasource:
        type: grafana
        uid: -- Grafana --
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      type: dashboard
  description: FinGreenOps dashboard for Kubernetes — sustainability score, CO₂ emissions
    (Scope 2 & 3), cloud costs, regional node cleanliness, top namespace impact, pod
    spend, and realized savings.
  editable: true
  fiscalYearStartMonth: 0
  graphTooltip: 1
  links:
  - icon: external link
    targetBlank: true
    title: GreenKube Docs
    type: link
    url: https://github.com/GreenKubeCloud/GreenKube
  panels:
  - collapsed: false
    gridPos:
      h: 1
      w: 24
      x: 0
      y: 0
    id: 100
    panels: []
    title: GreenKube Impact Command Center
    type: row
  - datasource:
      type: prometheus
      uid: grafanacloud-play-prom
    description: Dynamic radar chart for the live GreenKube sustainability score dimensions.
    fieldConfig:
      defaults:
        color:
          mode: thresholds
        max: 100
        min: 0
        thresholds:
          mode: absolute
          steps:
          - color: '#FB7185'
          - color: '#F59E0B'
            value: 60
          - color: '#00FFD4'
            value: 80
        unit: none
      overrides: []
    gridPos:
      h: 12
      w: 8
      x: 0
      y: 1
    id: 101
    options:
      baidu:
        callback: bmapReady
        key: ''
      editor:
        format: auto
      editorMode: code
      gaode:
        key: ''
        plugin: AMap.Scale,AMap.ToolBar
      getOption: "\nconst palette = {\n    bg: '#020617',\n    panel: 'rgba(15, 23,\
        \ 42, 0.74)',\n    panelSoft: 'rgba(15, 23, 42, 0.46)',\n    cyan: '#00FFD4',\n\
        \    teal: '#14B8A6',\n    blue: '#38BDF8',\n    green: '#34D399',\n    amber:\
        \ '#F59E0B',\n    red: '#FB7185',\n    text: '#E5F6FF',\n    muted: '#94A3B8',\n\
        \    grid: 'rgba(148, 163, 184, 0.16)',\n};\n\nconst valuesOf = (field) =>\
        \ field?.values?.buffer || field?.values || [];\n\nconst matchesRefId = (series,\
        \ refId) => series?.refId === refId\n    || series?.meta?.custom?.refId ===\
        \ refId\n    || series?.meta?.refId === refId\n    || series?.name === refId;\n\
        \nconst seriesForRef = (refId) => {\n    const direct = context.panel.data.series.find((series)\
        \ => matchesRefId(series, refId));\n    if (direct) {\n        return direct;\n\
        \    }\n\n    const fallbackIndex = refId.charCodeAt(0) - 'A'.charCodeAt(0);\n\
        \    return context.panel.data.series[fallbackIndex];\n};\n\nconst lastNumber\
        \ = (series) => {\n    const numberField = series?.fields.find((field) =>\
        \ field.type === 'number');\n    const values = valuesOf(numberField);\n \
        \   const rawValue = Number(values[values.length - 1] ?? 0);\n\n    return\
        \ Number.isFinite(rawValue) ? rawValue : 0;\n};\n\nconst valueFor = (refId,\
        \ clampToScore = false) => {\n    const series = seriesForRef(refId);\n  \
        \  const value = lastNumber(series);\n\n    return clampToScore ? Math.max(0,\
        \ Math.min(100, value)) : value;\n};\n\nconst pointsFor = (refId, labelKey,\
        \ limit = 3) => context.panel.data.series\n    .filter((series) => matchesRefId(series,\
        \ refId))\n    .map((series) => {\n        const numberField = series.fields.find((field)\
        \ => field.type === 'number');\n        const label = numberField?.labels?.[labelKey]\
        \ || series.name || labelKey;\n\n        return { name: label, value: lastNumber(series)\
        \ };\n    })\n    .filter((point) => Number.isFinite(point.value))\n    .sort((a,\
        \ b) => b.value - a.value)\n    .slice(0, limit);\n\nconst compactNumber =\
        \ (value) => {\n    if (!Number.isFinite(value)) {\n        return '0';\n\
        \    }\n\n    const absolute = Math.abs(value);\n    if (absolute >= 1000000000)\
        \ {\n        return `${(value / 1000000000).toFixed(1)}B`;\n    }\n    if\
        \ (absolute >= 1000000) {\n        return `${(value / 1000000).toFixed(1)}M`;\n\
        \    }\n    if (absolute >= 1000) {\n        return `${(value / 1000).toFixed(1)}k`;\n\
        \    }\n\n    return absolute >= 10 ? value.toFixed(0) : value.toFixed(1);\n\
        };\n\nconst formatValue = (value, unit) => {\n    if (unit === 'currencyUSD')\
        \ {\n        const absolute = Math.abs(value);\n        if (absolute > 0 &&\
        \ absolute < 0.01) {\n            return '<$0.01';\n        }\n\n        const\
        \ maximumFractionDigits = absolute >= 100 ? 0 : absolute >= 1 ? 2 : 3;\n \
        \       return `$${value.toLocaleString(undefined, { maximumFractionDigits\
        \ })}`;\n    }\n    if (unit === 'percent') {\n        return `${value.toFixed(0)}%`;\n\
        \    }\n    if (unit === 'g CO₂e') {\n        const absolute = Math.abs(value);\n\
        \        if (absolute >= 1000000) {\n            return `${(value / 1000000).toFixed(1)}\
        \ t CO₂e`;\n        }\n        if (absolute >= 1000) {\n            return\
        \ `${(value / 1000).toFixed(1)} kg CO₂e`;\n        }\n        if (absolute\
        \ >= 1) {\n            return `${value.toFixed(1)} g CO₂e`;\n        }\n \
        \       if (absolute > 0) {\n            return `${value.toFixed(3)} g CO₂e`;\n\
        \        }\n\n        return '0 g CO₂e';\n    }\n    if (unit === 'count')\
        \ {\n        return value.toFixed(0);\n    }\n\n    return compactNumber(value);\n\
        };\n\nconst dimensions = [\n    { refId: 'A', name: 'Resource efficiency',\
        \ max: 100 },\n    { refId: 'B', name: 'Carbon efficiency', max: 100 },\n\
        \    { refId: 'C', name: 'Waste elimination', max: 100 },\n    { refId: 'D',\
        \ name: 'Node efficiency', max: 100 },\n    { refId: 'E', name: 'Scaling practices',\
        \ max: 100 },\n    { refId: 'F', name: 'Carbon aware', max: 100 },\n    {\
        \ refId: 'G', name: 'Stability', max: 100 },\n];\n\nconst values = dimensions.map((dimension)\
        \ => valueFor(dimension.refId, true));\n\nconst globalScore = valueFor('H',\
        \ true);\nconst scoreColor = globalScore >= 80 ? palette.cyan : globalScore\
        \ >= 60 ? palette.amber : palette.red;\nconst scoreTextColor = globalScore\
        \ >= 80 ? '#D9FFF7' : globalScore >= 60 ? '#FFE6A6' : '#FFD6DE';\n\nreturn\
        \ {\n    backgroundColor: 'transparent',\n    color: [palette.cyan],\n   \
        \ tooltip: {\n        trigger: 'item',\n        confine: true,\n        position:\
        \ (point, params, dom, rect, size) => [size.viewSize[0] - size.contentSize[0]\
        \ - 12, 12],\n        backgroundColor: 'rgba(15, 23, 42, 0.96)',\n       \
        \ borderColor: palette.cyan,\n        borderWidth: 1,\n        padding: [10,\
        \ 12],\n        extraCssText: 'box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);\
        \ border-radius: 8px;',\n        textStyle: { color: palette.text, fontSize:\
        \ 12 },\n        formatter: (params) => {\n            const lines = dimensions.map((dimension,\
        \ index) => {\n                return `${dimension.name}: ${values[index].toFixed(0)}`;\n\
        \            });\n\n            return [`<strong>${params.name}</strong>`,\
        \ ...lines].join('<br/>');\n        },\n    },\n    legend: { show: false\
        \ },\n    radar: {\n        center: ['50%', '52%'],\n        radius: '68%',\n\
        \        splitNumber: 4,\n        shape: 'polygon',\n        axisName: {\n\
        \            color: palette.text,\n            fontSize: 12,\n           \
        \ fontWeight: 600,\n            padding: [2, 4],\n        },\n        axisLine:\
        \ { lineStyle: { color: 'rgba(148, 163, 184, 0.24)' } },\n        splitLine:\
        \ {\n            lineStyle: {\n                color: [\n                \
        \    'rgba(0, 255, 212, 0.34)',\n                    'rgba(148, 163, 184,\
        \ 0.22)',\n                    'rgba(148, 163, 184, 0.16)',\n            \
        \        'rgba(148, 163, 184, 0.10)',\n                ],\n              \
        \  width: 1,\n            },\n        },\n        splitArea: {\n         \
        \   areaStyle: {\n                color: ['rgba(0, 255, 212, 0.05)', 'rgba(15,\
        \ 23, 42, 0.14)'],\n            },\n        },\n        indicator: dimensions.map((dimension)\
        \ => ({ name: dimension.name, max: dimension.max })),\n    },\n    series:\
        \ [\n        {\n            name: 'Sustainability performance',\n        \
        \    type: 'radar',\n            z: 4,\n            label: { show: false },\n\
        \            data: [\n                {\n                    name: 'Score',\n\
        \                    value: values,\n                    symbol: 'circle',\n\
        \                    symbolSize: 6,\n                    areaStyle: { color:\
        \ 'rgba(0, 255, 212, 0.30)' },\n                    lineStyle: { color: palette.cyan,\
        \ width: 3 },\n                    itemStyle: {\n                        color:\
        \ palette.cyan,\n                        borderColor: 'rgba(255, 255, 255,\
        \ 0.92)',\n                        borderWidth: 1,\n                    },\n\
        \                },\n            ],\n            emphasis: {\n           \
        \     lineStyle: { width: 4 },\n                areaStyle: { opacity: 0.35\
        \ },\n                label: { show: false },\n            },\n        },\n\
        \    ],\n    graphic: [\n        {\n            type: 'text',\n          \
        \  left: 'center',\n            top: 'middle',\n            zlevel: 1000,\n\
        \            z: 100000,\n            silent: true,\n            style: {\n\
        \                text: String(Math.round(globalScore)),\n                fill:\
        \ scoreTextColor,\n                fontSize: 36,\n                fontWeight:\
        \ 800,\n                textAlign: 'center',\n                textVerticalAlign:\
        \ 'middle',\n                shadowBlur: 24,\n                shadowColor:\
        \ scoreColor,\n            },\n        },\n        {\n            type: 'text',\n\
        \            left: 'center',\n            top: '55%',\n            zlevel:\
        \ 1000,\n            z: 100000,\n            silent: true,\n            style:\
        \ {\n                text: '/ 100',\n                fill: scoreTextColor,\n\
        \                fontSize: 12,\n                fontWeight: 700,\n       \
        \         textAlign: 'center',\n                textVerticalAlign: 'top',\n\
        \                shadowBlur: 14,\n                shadowColor: scoreColor,\n\
        \            },\n        },\n    ],\n};\n"
      google:
        callback: gmapReady
        key: ''
      map: none
      renderer: canvas
      themeEditor:
        config: '{}'
        name: default
      visualEditor:
        code: return {};
        dataset: []
        series: []
    pluginVersion: 7.2.2
    targets:
    - datasource:
        type: prometheus
        uid: grafanacloud-play-prom
      expr: avg(max by (cluster, namespace) (greenkube_sustainability_dimension_score{cluster=~"$cluster",
        namespace=~"$namespace", namespace!="__all__", dimension="resource_efficiency"}))
      instant: true
      legendFormat: Resource efficiency
      range: false
      refId: A
    - datasource:
        type: prometheus
        uid: grafanacloud-play-prom
      expr: avg(max by (cluster, namespace) (greenkube_sustainability_dimension_score{cluster=~"$cluster",
        namespace=~"$namespace", namespace!="__all__", dimension="carbon_efficiency"}))
      instant: true
      legendFormat: Carbon efficiency
      range: false
      refId: B
    - datasource:
        type: prometheus
        uid: grafanacloud-play-prom
      expr: avg(max by (cluster, namespace) (greenkube_sustainability_dimension_score{cluster=~"$cluster",
        namespace=~"$namespace", namespace!="__all__", dimension="waste_elimination"}))
      instant: true
      legendFormat: Waste elimination
      range: false
      refId: C
    - datasource:
        type: prometheus
        uid: grafanacloud-play-prom
      expr: avg(max by (cluster, namespace) (greenkube_sustainability_dimension_score{cluster=~"$cluster",
        namespace=~"$namespace", namespace!="__all__", dimension="node_efficiency"}))
      instant: true
      legendFormat: Node efficiency
      range: false
      refId: D
    - datasource:
        type: prometheus
        uid: grafanacloud-play-prom
      expr: avg(max by (cluster, namespace) (greenkube_sustainability_dimension_score{cluster=~"$cluster",
        namespace=~"$namespace", namespace!="__all__", dimension="scaling_practices"}))
      instant: true
      legendFormat: Scaling practices
      range: false
      refId: E
    - datasource:
        type: prometheus
        uid: grafanacloud-play-prom
      expr: avg(max by (cluster, namespace) (greenkube_sustainability_dimension_score{cluster=~"$cluster",
        namespace=~"$namespace", namespace!="__all__", dimension="carbon_aware_scheduling"}))
      instant: true
      legendFormat: Carbon aware
      range: false
      refId: F
    - datasource:
        type: prometheus
        uid: grafanacloud-play-prom
      expr: avg(max by (cluster, namespace) (greenkube_sustainability_dimension_score{cluster=~"$cluster",
        namespace=~"$namespace", namespace!="__all__", dimension="stability"}))
      instant: true
      legendFormat: Stability
      range: false
      refId: G
    - datasource:
        type: prometheus
        uid: grafanacloud-play-prom
      expr: avg(max by (cluster, namespace) (greenkube_sustainability_score{cluster=~"$cluster",
        namespace=~"$namespace", namespace!="__all__"}))
      instant: true
      legendFormat: Global score
      range: false
      refId: H
    title: Sustainability Score Radar
    transparent: true
    type: volkovlabs-echarts-panel
  - datasource:
      type: prometheus
      uid: grafanacloud-play-prom
    description: Grouped ECharts bar chart for operational CO₂e, embodied CO₂e, and
      cloud cost.
    gridPos:
      h: 6
      w: 8
      x: 8
      y: 1
    id: 102
    options:
      baidu:
        callback: bmapReady
        key: ''
      editor:
        format: auto
      editorMode: code
      gaode:
        key: ''
        plugin: AMap.Scale,AMap.ToolBar
      getOption: "\nconst palette = {\n    bg: '#020617',\n    panel: 'rgba(15, 23,\
        \ 42, 0.74)',\n    panelSoft: 'rgba(15, 23, 42, 0.46)',\n    cyan: '#00FFD4',\n\
        \    teal: '#14B8A6',\n    blue: '#38BDF8',\n    green: '#34D399',\n    amber:\
        \ '#F59E0B',\n    red: '#FB7185',\n    text: '#E5F6FF',\n    muted: '#94A3B8',\n\
        \    grid: 'rgba(148, 163, 184, 0.16)',\n};\n\nconst valuesOf = (field) =>\
        \ field?.values?.buffer || field?.values || [];\n\nconst matchesRefId = (series,\
        \ refId) => series?.refId === refId\n    || series?.meta?.custom?.refId ===\
        \ refId\n    || series?.meta?.refId === refId\n    || series?.name === refId;\n\
        \nconst seriesForRef = (refId) => {\n    const direct = context.panel.data.series.find((series)\
        \ => matchesRefId(series, refId));\n    if (direct) {\n        return direct;\n\
        \    }\n\n    const fallbackIndex = refId.charCodeAt(0) - 'A'.charCodeAt(0);\n\
        \    return context.panel.data.series[fallbackIndex];\n};\n\nconst lastNumber\
        \ = (series) => {\n    const numberField = series?.fields.find((field) =>\
        \ field.type === 'number');\n    const values = valuesOf(numberField);\n \
        \   const rawValue = Number(values[values.length - 1] ?? 0);\n\n    return\
        \ Number.isFinite(rawValue) ? rawValue : 0;\n};\n\nconst valueFor = (refId,\
        \ clampToScore = false) => {\n    const series = seriesForRef(refId);\n  \
        \  const value = lastNumber(series);\n\n    return clampToScore ? Math.max(0,\
        \ Math.min(100, value)) : value;\n};\n\nconst pointsFor = (refId, labelKey,\
        \ limit = 3) => context.panel.data.series\n    .filter((series) => matchesRefId(series,\
        \ refId))\n    .map((series) => {\n        const numberField = series.fields.find((field)\
        \ => field.type === 'number');\n        const label = numberField?.labels?.[labelKey]\
        \ || series.name || labelKey;\n\n        return { name: label, value: lastNumber(series)\
        \ };\n    })\n    .filter((point) => Number.isFinite(point.value))\n    .sort((a,\
        \ b) => b.value - a.value)\n    .slice(0, limit);\n\nconst compactNumber =\
        \ (value) => {\n    if (!Number.isFinite(value)) {\n        return '0';\n\
        \    }\n\n    const absolute = Math.abs(value);\n    if (absolute >= 1000000000)\
        \ {\n        return `${(value / 1000000000).toFixed(1)}B`;\n    }\n    if\
        \ (absolute >= 1000000) {\n        return `${(value / 1000000).toFixed(1)}M`;\n\
        \    }\n    if (absolute >= 1000) {\n        return `${(value / 1000).toFixed(1)}k`;\n\
        \    }\n\n    return absolute >= 10 ? value.toFixed(0) : value.toFixed(1);\n\
        };\n\nconst formatValue = (value, unit) => {\n    if (unit === 'currencyUSD')\
        \ {\n        const absolute = Math.abs(value);\n        if (absolute > 0 &&\
        \ absolute < 0.01) {\n            return '<$0.01';\n        }\n\n        const\
        \ maximumFractionDigits = absolute >= 100 ? 0 : absolute >= 1 ? 2 : 3;\n \
        \       return `$${value.toLocaleString(undefined, { maximumFractionDigits\
        \ })}`;\n    }\n    if (unit === 'percent') {\n        return `${value.toFixed(0)}%`;\n\
        \    }\n    if (unit === 'g CO₂e') {\n        const absolute = Math.abs(value);\n\
        \        if (absolute >= 1000000) {\n            return `${(value / 1000000).toFixed(1)}\
        \ t CO₂e`;\n        }\n        if (absolute >= 1000) {\n            return\
        \ `${(value / 1000).toFixed(1)} kg CO₂e`;\n        }\n        if (absolute\
        \ >= 1) {\n            return `${value.toFixed(1)} g CO₂e`;\n        }\n \
        \       if (absolute > 0) {\n            return `${value.toFixed(3)} g CO₂e`;\n\
        \        }\n\n        return '0 g CO₂e';\n    }\n    if (unit === 'count')\
        \ {\n        return value.toFixed(0);\n    }\n\n    return compactNumber(value);\n\
        };\n\nconst rows = [\n    { refId: 'A', name: 'Scope 2', unit: 'g CO₂e', color:\
        \ palette.cyan },\n    { refId: 'B', name: 'Scope 3', unit: 'g CO₂e', color:\
        \ palette.blue },\n    { refId: 'C', name: 'Cloud cost', unit: 'currencyUSD',\
        \ color: palette.amber },\n];\n\nconst data = rows.map((row) => {\n    const\
        \ raw = Math.max(0, valueFor(row.refId));\n    return {\n        name: row.name,\n\
        \        value: Math.log10(raw + 1),\n        raw,\n        unit: row.unit,\n\
        \        itemStyle: {\n            color: {\n                type: 'linear',\n\
        \                x: 0,\n                y: 1,\n                x2: 0,\n  \
        \              y2: 0,\n                colorStops: [\n                   \
        \ { offset: 0, color: `${row.color}44` },\n                    { offset: 1,\
        \ color: row.color },\n                ],\n            },\n            borderRadius:\
        \ [7, 7, 0, 0],\n        },\n        label: { formatter: () => formatValue(raw,\
        \ row.unit) },\n    };\n});\n\nreturn {\n    backgroundColor: 'transparent',\n\
        \    tooltip: {\n        trigger: 'item',\n        backgroundColor: 'rgba(15,\
        \ 23, 42, 0.96)',\n        borderColor: palette.cyan,\n        borderWidth:\
        \ 1,\n        textStyle: { color: palette.text },\n        formatter: (params)\
        \ => `${params.name}<br/><strong>${formatValue(params.data.raw, params.data.unit)}</strong>`,\n\
        \    },\n    grid: { top: 26, right: 18, bottom: 36, left: 18 },\n    xAxis:\
        \ {\n        type: 'category',\n        data: rows.map((row) => row.name),\n\
        \        axisTick: { show: false },\n        axisLine: { lineStyle: { color:\
        \ palette.grid } },\n        axisLabel: { color: palette.text, fontSize: 12,\
        \ fontWeight: 600 },\n    },\n    yAxis: { type: 'value', show: false },\n\
        \    series: [\n        {\n            name: 'Current footprint',\n      \
        \      type: 'bar',\n            barWidth: '46%',\n            data,\n   \
        \         label: {\n                show: true,\n                position:\
        \ 'top',\n                color: palette.text,\n                fontSize:\
        \ 12,\n                fontWeight: 700,\n            },\n        },\n    ],\n\
        };\n"
      google:
        callback: gmapReady
        key: ''
      map: none
      renderer: canvas
      themeEditor:
        config: '{}'
        name: default
      visualEditor:
        code: return {};
        dataset: []
        series: []
    pluginVersion: 7.2.2
    targets:
    - datasource:
        type: prometheus
        uid: grafanacloud-play-prom
      expr: sum(max by (cluster, namespace) (greenkube_dashboard_summary_co2e_grams_total{cluster=~"$cluster",
        window="$dashboard_window", namespace=~"$namespace", namespace!="__all__",
        scope="scope2"})) or sum(max by (cluster) (greenkube_cluster_co2e_grams_total{cluster=~"$cluster"}))
      instant: false
      legendFormat: Scope 2
      range: true
      refId: A
    - datasource:
        type: prometheus
        uid: grafanacloud-play-prom
      expr: sum(max by (cluster, namespace) (greenkube_dashboard_summary_co2e_grams_total{cluster=~"$cluster",
        window="$dashboard_window", namespace=~"$namespace", namespace!="__all__",
        scope="scope3"})) or sum(max by (cluster) (greenkube_cluster_embodied_co2e_grams_total{cluster=~"$cluster"}))
      instant: false
      legendFormat: Scope 3
      range: true
      refId: B
    - datasource:
        type: prometheus
        uid: grafanacloud-play-prom
      expr: sum(max by (cluster, namespace) (greenkube_dashboard_summary_cost_dollars_total{cluster=~"$cluster",
        window="$dashboard_window", namespace=~"$namespace", namespace!="__all__"}))
        or sum(max by (cluster) (greenkube_cluster_cost_dollars_total{cluster=~"$cluster"}))
      instant: false
      legendFormat: Cloud cost
      range: true
      refId: C
    title: Footprint & Cost Mix
    transparent: true
    type: volkovlabs-echarts-panel
  - datasource:
      type: prometheus
      uid: grafanacloud-play-prom
    description: Grouped ECharts impact strip for realized savings and implemented
      recommendations.
    gridPos:
      h: 6
      w: 8
      x: 16
      y: 1
    id: 103
    options:
      baidu:
        callback: bmapReady
        key: ''
      editor:
        format: auto
      editorMode: code
      gaode:
        key: ''
        plugin: AMap.Scale,AMap.ToolBar
      getOption: "\nconst palette = {\n    bg: '#020617',\n    panel: 'rgba(15, 23,\
        \ 42, 0.74)',\n    panelSoft: 'rgba(15, 23, 42, 0.46)',\n    cyan: '#00FFD4',\n\
