    panel-14:
      kind: Panel
      spec:
        id: 14
        title: Highest Metrics DPM Stacks (top 3 stacks)
        description: 'Shows up to 3 of your stacks, ordered by those with the greatest
          average DPM per active-series.


          This value calculated at the current instant. ie. `now()`'
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: "sort_desc(\n  max by(id, name) (\n    60 * grafanacloud_instance_samples_per_second{id=~\"\
                      $metrics_id\"}\n    / grafanacloud_instance_active_series{id=~\"\
                      $metrics_id\"}\n\n    * on(id) group_left(name) topk by (id)\
                      \ (1, grafanacloud_instance_info{id=~\"$metrics_id\"})\n  )\n\
                      )\n"
                    format: table
                    instant: true
                refId: Average DPM per series
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: scalar(grafanacloud_org_metrics_included_dpm_per_series{org_id="$org_id"})
                    format: table
                    instant: true
                refId: Included DPM per series
                hidden: false
            transformations:
            - kind: Transformation
              group: configFromData
              spec:
                options:
                  applyTo:
                    id: byName
                    options: 'Value #Average DPM per series'
                  configRefId: Included DPM per series
                  mappings:
                  - fieldName: Time
                    handlerKey: __ignore
                  - fieldName: 'Value #Included DPM per series'
                    handlerKey: threshold1
            - kind: Transformation
              group: organize
              spec:
                options:
                  excludeByName:
                    id: true
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: gauge
          version: v11.1.0
          spec:
            options:
              reduceOptions:
                calcs:
                - mean
                limit: 3
                values: true
              showThresholdLabels: true
              showThresholdMarkers: true
            fieldConfig:
              defaults:
                unit: none
                min: 0
                max: 6
                thresholds:
                  mode: ''
                  steps:
                  - value: null
                    color: green
              overrides: []
        transparent: true
