    panel-107:
      kind: Panel
      spec:
        id: 107
        title: Total Application Observability Host Hours
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: grafanacloud_org_app_o11y_billable_host_hours{org_id="$org_id"}
                    instant: false
                    legendFormat: Billable Host Hours
                refId: A
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: 'avg without(monetary) (grafanacloud_org_app_o11y_overage{org_id="$org_id"})

                      # Hide monetary for customer of partner

                      - (9999999999 * $is_customer_of_partner) >= 0

                      '
                    instant: false
                    legendFormat: Additional Usage Amount
                refId: B
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: 'avg without(monetary) (grafanacloud_org_app_o11y_bill_fraction{org_id="$org_id"})

                      # Hide fractional for customer of grafana

                      - (2 * $is_customer_of_grafana) >= 0

                      '
                    instant: false
                    legendFormat: Cost fraction
                refId: C
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: grafanacloud_org_app_o11y_included_host_hours{org_id="$org_id"}
                    legendFormat: Included Host Hours
                refId: D
                hidden: false
            transformations:
            - kind: Transformation
              group: renameByRegex
              spec:
                options:
                  regex: (.*)Billable(.*)
                  renamePattern: $1$2
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: timeseries
          version: v11.1.0
          spec:
            options: {}
            fieldConfig:
              defaults:
                unit: short
                custom:
                  fillOpacity: 10
                  gradientMode: hue
                  showPoints: never
              overrides:
              - matcher:
                  id: byRegexp
                  options: /Additional Us(age|(ers?)) Amount/
                properties:
                - id: unit
                  value: currencyUSD
                - id: custom.hideFrom
                  value:
                    legend: true
                    tooltip: true
                    viz: true
              - matcher:
                  id: byRegexp
                  options: /^Included/
                properties:
                - id: custom.fillOpacity
                  value: 0
                - id: custom.lineWidth
                  value: 2
                - id: custom.lineStyle
                  value:
                    dash:
                    - 10
                    - 10
                    fill: dash
              - matcher:
                  id: byRegexp
                  options: .*[Ff]raction.*
                properties:
                - id: unit
                  value: percentunit
                - id: min
                  value: 0
                - id: max
                  value: 1
        transparent: true
