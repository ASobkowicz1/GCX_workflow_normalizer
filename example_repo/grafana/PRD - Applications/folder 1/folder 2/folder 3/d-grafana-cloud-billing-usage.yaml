    panel-12:
      kind: Panel
      spec:
        id: 12
        title: Metrics Active Series
        description: 'Shows:


          - Total active-series per managed Prometheus metrics service (GrafanaCloud
          Stack).

          - Active-series ingested in the Datadog format

          - Active-series ingested in the Influx format

          - Active-series per installed integration (with default job-name in Agent
          config)

          - Active-series generated by Asserts

          '
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: max(grafanacloud_instance_active_series{id=~"$metrics_id"})
                      by (id) * on (id) group_left(name) topk by(id) (1, grafanacloud_instance_info{id=~"$metrics_id"})
                    legendFormat: '{{ name }}'
                refId: A
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: max(grafanacloud_instance_active_datadog_series{id=~"$metrics_id"}
                      > 0) by (id) * on (id) group_left(name) topk by(id) (1, grafanacloud_instance_info{id=~"$metrics_id"})
                    legendFormat: '{{ name }}: Datadog format'
                refId: B
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: max(grafanacloud_instance_active_influx_series{id=~"$metrics_id"}
                      > 0) by (id) * on (id) group_left(name) topk by(id) (1, grafanacloud_instance_info{id=~"$metrics_id"})
                    legendFormat: '{{ name }}: Influx format'
                refId: C
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: max(grafanacloud_instance_active_integration_series{id=~"$metrics_id"})
                      by (id, integration) * on (id) group_left(name) topk by(id)
                      (1, grafanacloud_instance_info{id=~"$metrics_id"})
                    legendFormat: '{{name}}: {{integration}} intg.'
                refId: D
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: max(grafanacloud_instance_active_asserts_series{id=~"$metrics_id"}
                      > 0) by (id) * on (id) group_left(name) topk by(id) (1, grafanacloud_instance_info{id=~"$metrics_id"})
                    legendFormat: '{{name}}: Asserts active series'
                refId: E
                hidden: false
            transformations:
            - kind: Transformation
              group: renameByRegex
              spec:
                options:
                  regex: (.*)Billable(.*)
                  renamePattern: $1$2
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: timeseries
          version: v11.1.0
          spec:
            options: {}
            fieldConfig:
              defaults:
                unit: short
                custom:
                  fillOpacity: 10
                  gradientMode: hue
                  showPoints: never
              overrides:
              - matcher:
