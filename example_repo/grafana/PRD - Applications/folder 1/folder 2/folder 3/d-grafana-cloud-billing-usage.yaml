      label: Org
      hide: hideVariable
      refresh: never
      skipUrlSync: false
      query:
        kind: DataQuery
        group: prometheus
        version: v0
        datasource:
          name: grafanacloud-usage
        spec:
          __legacyStringValue: label_values(grafanacloud_org_info, org_slug)
      regex: ''
      sort: disabled
      options: []
      multi: false
      includeAll: false
      allowCustomValue: true
