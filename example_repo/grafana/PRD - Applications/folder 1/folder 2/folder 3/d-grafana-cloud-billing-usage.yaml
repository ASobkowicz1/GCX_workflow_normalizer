                    expr: "sum(\n  label_replace(\n    label_replace(\n      avg_over_time(grafanacloud_sm_billable_check_executions_per_second{org_id=\"\
                      $org_id\"}[1h]),\n      \"class\", \"protocol\", \"check_class\"\
                      , \"(protocol|scripted)\"\n    ), \"class\", \"browser\", \"\
                      check_class\", \"browser\"\n  )\n) by(class)\n"
                    legendFormat: '{{ name }}'
                refId: A
                hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: timeseries
