          spec:
            options:
              content: '## About Billable Usage


                - Metrics ingestion cost is calculated and billed using the 95th percentile
                of your active series and their samples, called data points, per minute
                (DPM).

                - Logs and traces costs are calculated and billed according to total
                monthly ingestion in bytes.

                - Grafana users cost is calculated and billed according to the number
                of <a href="https://grafana.com/docs/grafana-cloud/cost-management-and-billing/manage-invoices/understand-your-invoice/active-users-invoice/"
                target="_blank">active monthly users</a>, with additional per user
                costs for IRM (and Enterprise plugin for Pro tiers)

                - Load testing (k6) is billed according to <a href="https://grafana.com/docs/grafana-cloud/billing-and-usage/k6-billing/"
                target="_blank">Virtual User hours (VUh)</a>

                - Synthetic Monitoring is billed according to total monthly <a href="https://grafana.com/docs/grafana-cloud/cost-management-and-billing/understand-your-invoice/synthetic-monitoring-invoice/">test
                executions</a>.

