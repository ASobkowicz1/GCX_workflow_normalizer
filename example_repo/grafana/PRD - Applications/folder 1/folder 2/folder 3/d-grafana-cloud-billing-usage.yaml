    panel-32:
      kind: Panel
      spec:
        id: 32
        title: Query Usage Ratio
        description: Shows the ratio of queried to ingested bytes over the selected
          time period on each of your stacks.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: "sort_desc(\n  sum_over_time(\n    sum by (id) (\n     \
                      \ grafanacloud_logs_instance_query_bytes:rate5m{id=~\"$logs_id\"\
                      }\n    ) [$__range:1m]\n  ) /\n  sum_over_time(\n    sum by\
                      \ (id) (\n      grafanacloud_logs_instance_billable_bytes_received_per_second{id=~\"\
                      $logs_id\"}\n    ) [$__range:1m]\n  )\n) * on(id) group_left(name)\
                      \ topk by (id) (1, grafanacloud_logs_instance_info{id=~\"$logs_id\"\
                      })\n"
                    format: table
                    instant: true
                    legendFormat: '{{ name }}'
                refId: base
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: grafanacloud_org_logs_included_query_to_ingest_ratio{org_id="$org_id"}
                    format: table
                    instant: true
                    legendFormat: ''
                refId: total
                hidden: false
            transformations:
            - kind: Transformation
              group: configFromData
              spec:
                options:
                  applyTo:
                    id: byName
                    options: 'Value #base'
                  configRefId: total
                  mappings:
                  - fieldName: Time
                    handlerKey: __ignore
                  - fieldName: 'Value #total'
                    handlerKey: threshold1
            - kind: Transformation
              group: organize
              spec:
                options:
                  excludeByName:
                    id: true
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: stat
          version: v11.1.0
          spec:
            options:
              orientation: horizontal
              reduceOptions:
                values: true
            fieldConfig:
              defaults: {}
              overrides: []
        transparent: true
