          targetBlank: true
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: grafanacloud_org_metrics_billable_series{org_id="$org_id"}
                    instant: false
                    legendFormat: Billable Series
                refId: A
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: grafanacloud_org_metrics_included_series{org_id="$org_id"}
                    legendFormat: Included Series
                refId: B
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: 'max(grafanacloud_instance_billable_usage{org_id="$org_id"})
                      by (id) / ignoring(id) group_left() max(grafanacloud_org_metrics_billable_series{org_id="$org_id"})
                      by (id) * ignoring(id,org_id,cluster) group_left() avg without(monetary)
                      (grafanacloud_org_metrics_overage{org_id="$org_id"}) * on (id)
                      group_left(name) topk by(id) (1, grafanacloud_instance_info{org_id="$org_id"})

                      # Hide monetary for customer of partner

                      - (9999999999 * $is_customer_of_partner) >= 0

                      '
                    legendFormat: Additional Usage Amount - {{ name }}
                refId: C
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: 'max(grafanacloud_instance_billable_usage{org_id="$org_id"})
                      by (id) / ignoring(id) group_left() max(grafanacloud_org_metrics_billable_series{org_id="$org_id"})
                      by (id) * ignoring(id,org_id,cluster) group_left() avg without(monetary)
                      (grafanacloud_org_metrics_bill_fraction{org_id="$org_id"}) *
                      on (id) group_left(name) topk by(id) (1, grafanacloud_instance_info{org_id="$org_id"})

                      # Hide fractional for customer of grafana

                      - (2 * $is_customer_of_grafana) >= 0

                      '
                    legendFormat: Cost fraction - {{ name }}
                refId: D
                hidden: false
            transformations:
            - kind: Transformation
              group: renameByRegex
              spec:
                options:
                  regex: (.*)Billable(.*)
                  renamePattern: $1$2
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: timeseries
          version: v11.1.0
          spec:
            options: {}
            fieldConfig:
              defaults:
                unit: short
                custom:
                  fillOpacity: 10
                  gradientMode: hue
                  showPoints: never
              overrides:
              - matcher:
                  id: byRegexp
                  options: /Additional Us(age|(ers?)) Amount/
                properties:
                - id: unit
                  value: currencyUSD
                - id: custom.hideFrom
                  value:
                    legend: true
                    tooltip: true
                    viz: true
              - matcher:
