  links: []
  liveNow: false
  preload: false
  tags:
  - billing
  - grafanacloud
  timeSettings:
    timezone: utc
    from: now/M
    to: now
    autoRefresh: ''
    autoRefreshIntervals:
    - 5s
    - 10s
    - 30s
    - 1m
    - 5m
    - 15m
    - 30m
    - 1h
    - 2h
    - 1d
    hideTimepicker: false
    fiscalYearStartMonth: 0
  title: Grafana Cloud Billing/Usage
  variables:
  - kind: QueryVariable
    spec:
      name: org_slug
      current:
        text: dapperlabs
