      query:
        kind: DataQuery
        group: grafana
        version: v0
        datasource:
          name: -- Grafana --
        spec: {}
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      builtIn: true
      legacyOptions:
        type: dashboard
  cursorSync: 'Off'
  editable: true
  elements:
    panel-10:
      kind: Panel
      spec:
        id: 10
        title: ''
        links: []
        data:
          kind: QueryGroup
          spec:
            queries: []
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: text
          version: v11.1.0
          spec:
            options:
              content: '## About Billable Metrics Series


                This panel displays the 95th percentile of your active series and
                samples, or data points, per minute (DPM) for this month so far.

                You can dig deeper into your daily ingestion rates, totals, and more
                in the **Metrics Ingestion Details** row directly below this panel.


                For more information on cardinality and metrics usage, you can:


                - Learn to <a href="https://grafana.com/docs/grafana-cloud/metrics-control-usage/control-prometheus-metrics-usage/"
                target="_blank">Control Your Metrics Usage</a>

                - <a href="/d/cardinality-management" target="_blank">Locate your
                highest cardinality metrics</a> from your Cardinality Dashboards

                - <a href="/a/grafana-adaptive-metrics-app" target="_blank">Get started
                with our new Adaptive Metrics cost optimization tool</a>.

                '
            fieldConfig:
              defaults: {}
              overrides: []
        transparent: true
    panel-101:
      kind: Panel
      spec:
        id: 101
        title: Sessions Ingestion Rate
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: sum(grafanacloud_mobile_observability_instance_sessions_per_second{org_id="$org_id"})
                      by (id, appName)
                    legendFormat: '{{ appName }}'
                refId: A
                hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: timeseries
          version: v11.1.0
          spec:
            options:
              legend:
                calcs:
                - mean
                - lastNotNull
                - max
                - min
                displayMode: table
                placement: right
                width: 450
            fieldConfig:
              defaults:
                unit: cps
                custom:
                  fillOpacity: 10
              overrides: []
        transparent: true
    panel-102:
      kind: Panel
      spec:
        id: 102
        title: Total Sessions Ingested by day
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: prometheus
                  version: v0
                  datasource:
                    name: grafanacloud-usage
                  spec:
                    expr: sum(sum_over_time((grafanacloud_mobile_observability_instance_sessions_per_second{org_id="$org_id"}
                      offset -1d * 60)[1d:1m])) by (id, appName) or vector(0)
                    interval: 1d
                    legendFormat: '{{ appName }}'
                refId: A
                hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: timeseries
          version: v11.1.0
          spec:
            options:
              legend:
                calcs:
                - mean
                - max
                - min
                displayMode: table
                placement: right
                width: 450
            fieldConfig:
              defaults:
                unit: short
                custom:
                  drawStyle: bars
                  fillOpacity: 100
                  stacking:
                    mode: normal
              overrides:
              - matcher:
                  id: byValue
                  options:
                    op: gte
                    reducer: allIsZero
                    value: 0
                properties:
                - id: custom.hideFrom
                  value:
                    legend: true
                    tooltip: true
                    viz: false
        transparent: true
