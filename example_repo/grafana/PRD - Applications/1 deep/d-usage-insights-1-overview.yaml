                hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: stat
          version: ''
          spec:
            options:
              colorMode: background
              graphMode: none
              justifyMode: center
              orientation: auto
              reduceOptions:
                fields: /^Value \#A$/
              textMode: value
            fieldConfig:
              defaults:
                unit: short
                color:
                  mode: fixed
                  fixedColor: purple
              overrides: []
    panel-3:
