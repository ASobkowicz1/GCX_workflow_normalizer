  timeSettings:
    from: now-24h
    to: now
    autoRefresh: ''
    autoRefreshIntervals:
    - 5s
    - 10s
    - 30s
    - 1m
    - 5m
    - 15m
    - 30m
    - 1h
    - 2h
    - 1d
    hideTimepicker: false
    fiscalYearStartMonth: 0
  title: Usage Insights - 1 - Overview
  variables:
  - kind: QueryVariable
    spec:
      name: instance_id
      current:
        text: All
        value: $__all
      label: Instance
      hide: dontHide
      refresh: onDashboardLoad
      skipUrlSync: false
      query:
        kind: DataQuery
        group: prometheus
        version: v0
        datasource:
          name: grafanacloud-usage
        spec:
          query: grafanacloud_grafana_instance_info{}
          refId: StandardVariableQuery
      regex: /,id="(?<value>[^"]+)|,slug="(?<text>[^"]+)/g
      sort: disabled
      definition: grafanacloud_grafana_instance_info{}
      options: []
      multi: false
      includeAll: true
      allValue: .*
      allowCustomValue: true
  preferences:
    layout:
      kind: GridLayout
      spec:
        items: []
