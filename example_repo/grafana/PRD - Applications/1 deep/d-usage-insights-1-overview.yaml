apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  name: d-81d5af747296514ce37b
  annotations:
    grafana.app/folder: f-fc165432936809ead826
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      query:
        kind: DataQuery
        group: grafana
        version: v0
        datasource:
          name: -- Grafana --
        spec: {}
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      builtIn: true
      legacyOptions:
        type: dashboard
  cursorSync: 'Off'
  description: This is a Usage Insights dashboard expecting Grafana events in logfmt
    instead of json.
  editable: false
  elements:
    panel-10:
      kind: Panel
      spec:
        id: 10
        title: Top 10 users
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: loki
                  version: v0
                  datasource:
                    name: grafanacloud-asdevstack-usage-insights
                  spec:
                    expr: topk(10, sum by (username) (count_over_time({instance_type="grafana",
                      instance_id=~"$instance_id"} | logfmt | eventName="dashboard-view"
                      [$__range])))
                    legendFormat: '{{username}}'
                    queryType: instant
                refId: A
                hidden: false
            transformations:
            - kind: Transformation
              group: organize
              spec:
                options:
                  excludeByName:
                    Time: true
                  renameByName:
                    'Value #A': Views
                    username: Name
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: table
          version: ''
          spec:
            options:
              showHeader: true
              sortBy:
              - desc: true
                displayName: Views
            fieldConfig:
              defaults: {}
              overrides:
              - matcher:
                  id: byName
                  options: Views
                properties:
                - id: custom.cellOptions
                  value:
                    mode: lcd
                    type: gauge
                - id: color
                  value:
                    mode: continuous-BlPu
    panel-11:
      kind: Panel
      spec:
        id: 11
        title: Top 10 dashboards with errors
        description: Click on the error count to view errors
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: loki
                  version: v0
                  datasource:
                    name: grafanacloud-asdevstack-usage-insights
                  spec:
                    expr: topk(10, sum by (dashboardUid,dashboardName) (count_over_time({instance_type="grafana",
                      instance_id=~"$instance_id"} | logfmt | eventName="data-request"
                      | error!="" [$__range])))
                    legendFormat: ''
                    queryType: instant
                refId: A
                hidden: false
            transformations:
            - kind: Transformation
              group: organize
              spec:
                options:
                  excludeByName:
                    Time: true
                  renameByName:
                    'Value #A': Error Count
                    dashboardName: Name
                    dashboardUid: UID
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: table
          version: ''
          spec:
            options:
              showHeader: true
              sortBy:
              - desc: true
                displayName: Error Count
            fieldConfig:
              defaults: {}
              overrides:
              - matcher:
                  id: byName
                  options: Error Count
                properties:
                - id: custom.cellOptions
                  value:
                    mode: lcd
                    type: gauge
                - id: color
                  value:
                    mode: continuous-YlRd
                - id: links
                  value:
                  - targetBlank: true
                    title: View errors
                    url: /d/MpmkYhRVz/usage-insights-3-query-errors?var-search=${__data.fields.UID}
              - matcher:
                  id: byName
                  options: UID
                properties:
                - id: custom.hidden
                  value: true
    panel-12:
      kind: Panel
      spec:
        id: 12
        title: Top 10 data sources with errors
        description: Click on the data source name or ID to view details, click on
          the error count to view errors
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: loki
                  version: v0
                  datasource:
                    name: grafanacloud-asdevstack-usage-insights
                  spec:
                    expr: topk(10, sum by (datasourceName, datasourceUid) (count_over_time({instance_type="grafana",
                      instance_id=~"$instance_id"} | logfmt | eventName="data-request"
                      | datasourceName != "-- Grafana --" | datasourceName != "--
                      Mixed --" | error!="" [$__range])))
                    legendFormat: ''
                    queryType: instant
                refId: A
                hidden: false
            transformations:
            - kind: Transformation
              group: organize
              spec:
                options:
                  excludeByName:
                    Time: true
                  renameByName:
                    'Value #A': Error Count
                    datasourceName: Name
                    datasourceUid: ID
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: table
          version: ''
          spec:
            options:
              showHeader: true
              sortBy:
              - desc: true
                displayName: Error Count
            fieldConfig:
              defaults:
                links:
                - title: Go to data source usage insights
                  url: /d/AEbrOO2Mz/usage-insights-2-data-sources?var-datasource_id=${__data.fields.ID}&var-datasource_name=${__data.fields.Name:percentencode}&${__url_time_range}
              overrides:
              - matcher:
                  id: byName
                  options: Error Count
                properties:
                - id: custom.cellOptions
                  value:
                    mode: lcd
                    type: gauge
                - id: color
                  value:
                    mode: continuous-YlRd
                - id: links
                  value:
                  - targetBlank: true
                    title: View errors
                    url: /d/MpmkYhRVz/usage-insights-3-query-errors?var-search=${__data.fields.Name}
              - matcher:
                  id: byName
                  options: ID
                properties:
                - id: custom.width
                  value: 41
    panel-13:
      kind: Panel
      spec:
        id: 13
        title: Top 10 users seeing errors
