    panel-7:
      kind: Panel
      spec:
        id: 7
        title: Usage insights events
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: loki
                  version: v0
                  datasource:
                    name: grafanacloud-asdevstack-usage-insights
                  spec:
                    editorMode: code
                    expr: sum by(host) (count_over_time({instance_type="grafana",
                      instance_id=~"$instance_id"} | logfmt | eventName="data-request"
                      | error = "" [$__interval]))
                    legendFormat: Data Request Successes
                    queryType: range
                refId: A
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: loki
                  version: v0
                  datasource:
                    name: grafanacloud-asdevstack-usage-insights
                  spec:
                    editorMode: code
                    expr: sum by(host) (count_over_time({instance_type="grafana",
                      instance_id=~"$instance_id"} | logfmt | eventName="data-request"
                      | error != "" [$__interval]))
                    legendFormat: Data Request Errors
                    queryType: range
                refId: B
                hidden: false
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: loki
                  version: v0
                  datasource:
                    name: grafanacloud-asdevstack-usage-insights
                  spec:
                    editorMode: code
                    expr: sum by(host) (count_over_time({instance_type="grafana",
                      instance_id=~"$instance_id"} | logfmt | eventName="dashboard-view"
                      [$__interval]))
                    legendFormat: Dashboard Views
                    queryType: range
                refId: C
                hidden: false
            transformations: []
            queryOptions:
              interval: 5m
        vizConfig:
          kind: VizConfig
          group: timeseries
          version: ''
          spec:
            options:
              legend:
                displayMode: table
                placement: right
                showLegend: true
              tooltip:
                mode: multi
                sort: desc
            fieldConfig:
              defaults:
                unit: short
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ''
                  axisPlacement: auto
                  barAlignment: 0
                  drawStyle: line
                  fillOpacity: 10
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 1
                  pointSize: 3
                  scaleDistribution:
                    type: linear
                  showPoints: always
                  spanNulls: false
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
              overrides:
              - matcher:
                  id: byName
                  options: Data Request Successes
                properties:
                - id: color
                  value:
                    fixedColor: semi-dark-blue
                    mode: fixed
              - matcher:
                  id: byName
                  options: Data Request Errors
                properties:
                - id: color
                  value:
                    fixedColor: semi-dark-red
                    mode: fixed
              - matcher:
                  id: byName
                  options: Dashboard Views
                properties:
                - id: color
                  value:
                    fixedColor: semi-dark-green
                    mode: fixed
