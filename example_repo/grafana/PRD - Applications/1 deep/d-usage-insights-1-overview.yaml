                    legendFormat: ''
                    queryType: instant
                refId: A
                hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: stat
          version: ''
          spec:
            options:
              colorMode: background
              graphMode: none
              justifyMode: auto
              orientation: auto
              reduceOptions:
                fields: /^Value \#A$/
              textMode: value
            fieldConfig:
              defaults:
                color:
                  mode: fixed
                  fixedColor: purple
                custom:
                  filterable: false
              overrides: []
    panel-4:
      kind: Panel
