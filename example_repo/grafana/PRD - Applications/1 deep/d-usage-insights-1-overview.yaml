          spec:
            queries:
            - kind: PanelQuery
              spec:
                query:
                  kind: DataQuery
                  group: loki
                  version: v0
                  datasource:
                    name: grafanacloud-asdevstack-usage-insights
                  spec:
                    expr: topk(10, sum by (username) (count_over_time({instance_type="grafana",
                      instance_id=~"$instance_id"} | logfmt | eventName="data-request"
                      | error!="" | datasourceName != "-- Grafana --" | datasourceName
                      != "-- Mixed --" [$__range])))
                    legendFormat: '{{username}}'
                    queryType: instant
                refId: A
                hidden: false
            transformations:
            - kind: Transformation
              group: organize
              spec:
                options:
                  excludeByName:
                    Time: true
                  renameByName:
                    'Value #A': Error Count
                    username: Username
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: table
          version: ''
          spec:
            options:
              showHeader: true
              sortBy:
              - desc: true
                displayName: Error Count
            fieldConfig:
              defaults:
                custom:
                  cellOptions:
                    type: auto
                  filterable: false
              overrides:
              - matcher:
                  id: byName
                  options: Error Count
                properties:
                - id: custom.cellOptions
                  value:
                    mode: lcd
                    type: gauge
                - id: color
                  value:
                    mode: continuous-YlRd
                - id: links
                  value:
                  - targetBlank: true
                    title: View errors
                    url: /d/MpmkYhRVz/usage-insights-3-query-errors?var-search=${__data.fields.Username}
    panel-2:
      kind: Panel
      spec:
