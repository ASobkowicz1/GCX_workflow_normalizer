                      'Value #B': 6
                      'Value #C': 7
                      query: 2
                      query_hash: 0
                      rule_folder: 3
                      rule_name: 4
                      user: 1
                    renameByName:
                      'Value #A': ''
                      'Value #B': '# of queries in range'
                      'Value #C': estimated interval
              - kind: Transformation
                group: calculateField
                spec:
                  options:
                    alias: bytes per query
                    binary:
                      left:
                        matcher:
                          id: byName
                          options: 'Value #A'
                      operator: /
                      right:
