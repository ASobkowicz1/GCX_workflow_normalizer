                  query:
                    kind: DataQuery
                    group: loki
                    version: v0
                    datasource:
                      name: grafanacloud-asdevstack-usage-insights
                    spec:
                      editorMode: code
                      expr: >-
                        topk(20, sum by (query_hash, query, rule_name,
                        rule_folder, user) (sum_over_time({org_id="$orgID"} |=
                        "request timings" |logfmt| user=~"$instance" |
                        path=~"/loki/api/v1/.*"| source="grafana-alert"| unwrap
                        bytes(total_bytes)[$__range])))
