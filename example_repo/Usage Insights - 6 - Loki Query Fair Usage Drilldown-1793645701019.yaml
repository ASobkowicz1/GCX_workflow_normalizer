    panel-11:
      kind: Panel
      spec:
        id: 11
        title: Grafana Alerts
        description: >-
          If *some* rulers in this table do not show rule_folder and rule_name
          values then they are likely Grafana Recorded Queries and not Grafana
          Managed Alerts
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
