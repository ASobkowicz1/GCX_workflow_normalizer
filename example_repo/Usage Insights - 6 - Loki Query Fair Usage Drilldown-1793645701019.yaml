                      expr: |-
                        60
                        /
                        (
                            topk(10000,
                                sum by (query_hash) (
                                    count_over_time(
                                        {org_id="$orgID"} |= "request timings" |logfmt| user=~"$instance" | path=~"/loki/api/v1/.*"| source="grafana-alert" | total_bytes > 1MB
                                        [$__range]
                                    )
                                ) > 0
                            )
                            /
                            ($__range_s/60)
                        )
                      queryType: instant
                  refId: C
                  hidden: false
            transformations:
              - kind: Transformation
                group: joinByField
                spec:
                  options:
                    byField: query_hash
                    mode: inner
              - kind: Transformation
                group: sortBy
                spec:
                  options:
                    sort:
                      - desc: true
                        field: 'Value #A'
              - kind: Transformation
                group: filterFieldsByName
                spec:
                  options:
                    byVariable: false
                    include:
                      names:
                        - query_hash
                        - query
                        - rule_folder
                        - user
                        - 'Value #A'
                        - 'Value #B'
                        - 'Value #C'
                        - rule_name
              - kind: Transformation
                group: limit
                spec:
                  options:
                    limitField: '10'
              - kind: Transformation
                group: organize
                spec:
                  options:
                    indexByName:
