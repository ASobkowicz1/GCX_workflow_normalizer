name: Grafana Observability as Code (GCX - Wariant 2 Hybrydowy)

on:
  push:
    paths:
      - "grafana/**"
      - "normalizer/**"
      - ".github/workflows/grafana-observability.yml"
  pull_request:
    branches:
      - prd
      - dev
      - tech
    paths:
      - "grafana/**"
      - "normalizer/**"
      - ".github/workflows/grafana-observability.yml"

concurrency:
  group: gcx-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  observability:
    name: GCX Plan / Deploy (Wariant 2 - Hybrydowy)
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Determine target environment (stack) and git branch variables
        id: env_ctx
        run: |
          BRANCH_NAME="${{ github.ref_name }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_ENV="${{ github.base_ref }}"
            CHECKOUT_REF="${{ github.head_ref }}"
            BASE_REF="origin/${{ github.base_ref }}"
            MODE="plan"
          elif [[ "${BRANCH_NAME}" =~ ^(prd|dev|tech)$ ]]; then
            TARGET_ENV="${BRANCH_NAME}"
            CHECKOUT_REF="${BRANCH_NAME}"
            BASE_REF="${{ github.event.before }}"
            MODE="deploy"
          elif [[ "${BRANCH_NAME}" =~ ^(prd|dev|tech)([/_-].*)?$ ]]; then
            TARGET_ENV="${BASH_REMATCH[1]}"
            CHECKOUT_REF="${BRANCH_NAME}"
            BASE_REF="origin/${TARGET_ENV}"
            MODE="plan"
          else
            echo "⏭️ Branch '${BRANCH_NAME}' nie zaczyna się od prd, dev ani tech – kończę workflow."
            echo "MODE=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "TARGET_ENV=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "CHECKOUT_REF=${CHECKOUT_REF}" >> "$GITHUB_OUTPUT"
          echo "BASE_REF=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "MODE=${MODE}" >> "$GITHUB_OUTPUT"
          echo "🎯 Wykryty tryb: ${MODE} | Środowisko (stack): ${TARGET_ENV} | Base ref: ${BASE_REF}"

      - name: Checkout repository
        if: steps.env_ctx.outputs.MODE != 'skip'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.env_ctx.outputs.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Setup GCX binary
        if: steps.env_ctx.outputs.MODE != 'skip'
        run: |
          if ! command -v gcx &> /dev/null; then
            if [ -f ".github/bin/gcx-linux-amd64.tar.gz" ]; then
              tar -xzf .github/bin/gcx-linux-amd64.tar.gz -C /usr/local/bin
              chmod +x /usr/local/bin/gcx
            elif [ -f "./gcx" ]; then
              chmod +x ./gcx
              sudo mv ./gcx /usr/local/bin/gcx
            fi
          fi
          gcx --version

      - name: Configure AWS Credentials (Assume Role)
        if: steps.env_ctx.outputs.MODE != 'skip'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-grafana-${{ steps.env_ctx.outputs.TARGET_ENV }}
          aws-region: eu-central-1

      - name: Fetch Grafana stack config JSON from AWS SSM and configure GCX
        if: steps.env_ctx.outputs.MODE != 'skip'
        env:
          TARGET_ENV: ${{ steps.env_ctx.outputs.TARGET_ENV }}
        run: |
          SSM_PARAM_PATH="/grafana/${TARGET_ENV}/config"
          SSM_JSON=$(aws ssm get-parameter --name "${SSM_PARAM_PATH}" --with-decryption --query "Parameter.Value" --output text)

          GRAFANA_URL=$(echo "${SSM_JSON}" | jq -r '.url')
          GRAFANA_TOKEN=$(echo "${SSM_JSON}" | jq -r '.token')
          GRAFANA_STACK_ID=$(echo "${SSM_JSON}" | jq -r '.stack_id')

          echo "::add-mask::${GRAFANA_TOKEN}"

          mkdir -p ~/.config/gcx
          cat <<EOF > ~/.config/gcx/config.yaml
          version: 1
          current-context: ${TARGET_ENV}
          contexts:
            ${TARGET_ENV}:
              stack: ${TARGET_ENV}
          stacks:
            ${TARGET_ENV}:
              slug: ${TARGET_ENV}
              grafana:
                server: ${GRAFANA_URL}
                token: "${GRAFANA_TOKEN}"
                auth-method: token
                stack-id: ${GRAFANA_STACK_ID}
          EOF

          gcx config check --context "${TARGET_ENV}"

      - name: Setup Python & PyYAML
        if: steps.env_ctx.outputs.MODE != 'skip'
        run: |
          python3 -m pip install --quiet pyyaml

      - name: Run Normalizer & Hybrid Plan (Git Diff + Grafana Check)
        if: steps.env_ctx.outputs.MODE == 'plan'
        env:
          TARGET_ENV: ${{ steps.env_ctx.outputs.TARGET_ENV }}
          BASE_REF: ${{ steps.env_ctx.outputs.BASE_REF }}
        run: |
          python3 -m normalizer plan \
            --repo-root . \
            --data-dir grafana \
            --base-ref "${BASE_REF}" \
            --gcx-bin gcx \
            --context "${TARGET_ENV}" \
            --summary-file plan.md

      - name: Commit normalized manifests back to PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grafana/
          if ! git diff --cached --quiet; then
            git commit -m "chore(normalizer): normalize Grafana resources for ${{ steps.env_ctx.outputs.TARGET_ENV }}"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "Brak nowych surowych plików do zacommitowania – manifesty są już kanoniczne."
          fi

      - name: Post Plan Summary comment on Pull Request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('plan.md')) return;
            const body = fs.readFileSync('plan.md', 'utf8');
            const marker = '<!-- gcx-normalizer-plan -->';
            const fullBody = `${marker}\n### 🎯 Target Stack: \`${{ steps.env_ctx.outputs.TARGET_ENV }}\`\n\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Run Hybrid Deploy (Apply on Grafana Cloud)
        if: steps.env_ctx.outputs.MODE == 'deploy'
        env:
          TARGET_ENV: ${{ steps.env_ctx.outputs.TARGET_ENV }}
          BASE_REF: ${{ steps.env_ctx.outputs.BASE_REF }}
        run: |
          python3 -m normalizer deploy \
            --repo-root . \
            --data-dir grafana \
            --base-ref "${BASE_REF}" \
            --target-ref "${{ github.sha }}" \
            --gcx-bin gcx \
            --context "${TARGET_ENV}"
