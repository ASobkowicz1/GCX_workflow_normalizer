name: Scheduled Grafana Drift Auditor (Live Sync)

# Workflow odpowiedzialny za okresowy audyt i opcjonalne naprawianie driftu pomiędzy
# stanem rzeczywistym w Grafana Cloud a stanem zadeklarowanym w repozytorium Git.
on:
  schedule:
    # Uruchamiane automatycznie w nocy (02:00 UTC) dla gałęzi produkcyjnej
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment to audit/reconcile"
        required: true
        type: choice
        options:
          - prd
          - dev
          - tech
        default: prd
      mode:
        description: "Execution mode: deploy (reconcile/fix drift in Grafana) or plan (report drift only)"
        required: true
        type: choice
        options:
          - deploy
          - plan
        default: deploy

concurrency:
  group: gcx-live-sync-${{ inputs.target_env || 'prd' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  drift_audit:
    name: Grafana live drift audit
    runs-on: ubuntu-latest

    steps:
      # KROK 1: Wyznaczenie środowiska i trybu pracy
      - name: Determine target stack and execution mode
        id: env_ctx
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TARGET_ENV="prd"
            MODE="deploy"
          else
            TARGET_ENV="${{ inputs.target_env || 'prd' }}"
            MODE="${{ inputs.mode || 'deploy' }}"
          fi
          echo "TARGET_ENV=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "MODE=${MODE}" >> "$GITHUB_OUTPUT"
          echo "🎯 Target environment: ${TARGET_ENV} | Mode: ${MODE}"

      # KROK 2: Pobranie kodu ze wskazanego brancha środowiskowego
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.env_ctx.outputs.TARGET_ENV }}

      # KROK 3: Przygotowanie binarki GCX
      - name: Setup GCX
        run: |
          if ! command -v gcx &> /dev/null; then
            if [ -f ".github/bin/gcx-linux-amd64.tar.gz" ]; then
              tar -xzf .github/bin/gcx-linux-amd64.tar.gz -C /usr/local/bin
              chmod +x /usr/local/bin/gcx
            elif [ -f "./gcx" ]; then
              chmod +x ./gcx
              sudo mv ./gcx /usr/local/bin/gcx
            fi
          fi
          gcx --version

      # KROK 4: Instalacja zależności Pythona
      - name: Setup Python
        run: |
          python3 -m pip install --quiet pyyaml

      # KROK 5A: Logowanie do AWS OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-grafana-${{ steps.env_ctx.outputs.TARGET_ENV }}
          aws-region: eu-central-1

      # KROK 5B: Pobranie poświadczeń stacka Grafany z AWS SSM
      - name: Configure Grafana credentials
        run: |
          TARGET_ENV="${{ steps.env_ctx.outputs.TARGET_ENV }}"
          SSM_PARAM_PATH="/grafana/${TARGET_ENV}/config"
          SSM_JSON=$(aws ssm get-parameter --name "${SSM_PARAM_PATH}" --with-decryption --query "Parameter.Value" --output text)

          GRAFANA_URL=$(echo "${SSM_JSON}" | jq -r '.url')
          GRAFANA_TOKEN=$(echo "${SSM_JSON}" | jq -r '.token')
          GRAFANA_STACK_ID=$(echo "${SSM_JSON}" | jq -r '.stack_id')

          echo "::add-mask::${GRAFANA_TOKEN}"

          mkdir -p ~/.config/gcx
          cat <<EOF > ~/.config/gcx/config.yaml
          version: 1
          current-context: default
          contexts:
            default:
              stack: default
          stacks:
            default:
              slug: default
              grafana:
                server: ${GRAFANA_URL}
                token: "${GRAFANA_TOKEN}"
                auth-method: token
                stack-id: ${GRAFANA_STACK_ID}
          EOF

          gcx config check

      # KROK 6: Wykonanie audytu / uzgodnienia stanu żywego
      - name: Execute Live Drift Auditor
        run: |
          MODE="${{ steps.env_ctx.outputs.MODE }}"
          python3 normalizer-live-grafana-sync/normalizer/cli.py "${MODE}" \
            --repo-root . \
            --data-dir grafana \
            --gcx-bin gcx
